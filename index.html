<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل قياسات المحاليل الزراعية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary-color: #2E7D32;
            --secondary-color: #4CAF50;
            --bg-color: #f4f9f4;
            --text-color: #333;
            --border-color: #ccc;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1300px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: var(--primary-color);
        }
        .header-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px dashed var(--primary-color);
        }
        @media (max-width: 768px) {
            .header-info { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .header-info { grid-template-columns: 1fr; }
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--primary-color);
        }
        input[type="text"], input[type="number"], input[type="date"] {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-family: inherit;
            text-align: right;
        }
        .form-section {
            background-color: #e8f5e9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .section-title {
            grid-column: 1 / -1;
            font-weight: bold;
            color: var(--primary-color);
            border-bottom: 1px solid var(--secondary-color);
            padding-bottom: 5px;
            margin-bottom: 10px;
            margin-top: 10px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-family: inherit;
            transition: 0.3s;
        }
        button:hover { background-color: #1b5e20; }
        .btn-delete { background-color: #d32f2f; }
        .btn-delete:hover { background-color: #b71c1c; }
        .btn-edit { background-color: #fbc02d; color: black; }
        .btn-edit:hover { background-color: #f9a825; }
        .btn-export { background-color: #1976D2; margin-bottom: 15px; }
        .btn-export:hover { background-color: #1565C0; }
        .table-responsive { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            font-size: 14px;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: center;
            vertical-align: middle;
            /* ======= التعديل الوحيد: الكسر بين الكلمات فقط لا من وسطها ======= */
            white-space: normal;
            word-break: keep-all;
            overflow-wrap: anywhere;
        }
        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: bold;
        }
        tr:nth-child(even) { background-color: #f9f9f9; }

        .fake-rowspan-top {
            border-bottom: none !important;
            vertical-align: bottom;
            padding-bottom: 6px;
        }
        .fake-rowspan-bottom {
            border-top: none !important;
            padding-top: 6px;
        }

        .printing .header-info { border-bottom: none; grid-template-columns: repeat(4, 1fr); }
       .printing .header-info input {
    border: none !important;
    background: transparent !important;
    /* التعديل هنا: إضافة مسافة 8 بيكسل من اليمين واليسار لمنع قص الحروف */
    padding: 0 8px !important; 
    color: black !important;
    font-weight: bold !important;
    font-size: 16px !important;
    text-align: right !important;
    direction: rtl !important;
    width: 95%; /* لضمان عدم خروج النص عن الإطار */
}

        .printing .header-info input[type="date"]::-webkit-calendar-picker-indicator { display: none; }
        
        @media print {
            .no-print { display: none !important; }
            .container { box-shadow: none; padding: 0; }
            body { background: white; }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h1>سجل متابعة المحاليل الزراعية</h1>

    <div class="header-info" id="reportHeader">
        <div class="input-group"><label>الموقع / رقم المحمية:</label><input type="text" id="siteName" placeholder="مثال: محمية ١٠"></div>
        <div class="input-group"><label>نوع المحصول:</label><input type="text" id="cropType" placeholder="طماطم"></div>
        <div class="input-group"><label>اسم العامل / المسؤول:</label><input type="text" id="workerName"></div>
        <div class="input-group"><label>تاريخ الزراعة:</label><input type="date" id="plantDate"></div>
    </div>

    <div class="form-section no-print">
        <h2>إدخال / تعديل بيانات يومية</h2>
        <input type="hidden" id="editIndex" value="-1">
        <div class="form-grid">
            <div class="input-group"><label>التاريخ:</label><input type="date" id="entryDate"></div>
            
            <div class="section-title">قياس المحلول قبل الإضافة</div>
            <div class="input-group"><label>EC</label><input type="number" step="0.01" id="beforeEC"></div>
            <div class="input-group"><label>PH</label><input type="number" step="0.01" id="beforePH"></div>
            <div class="input-group"><label>T.D.C</label><input type="number" step="0.01" id="beforeTDC"></div>

            <div class="section-title">قياس بعد الإضافة</div>
            <div class="input-group"><label>EC</label><input type="number" step="0.01" id="afterEC"></div>
            <div class="input-group"><label>PH</label><input type="number" step="0.01" id="afterPH"></div>
            <div class="input-group"><label>T.D.C</label><input type="number" step="0.01" id="afterTDC"></div>

            <div class="section-title">معلومات إضافية ونمو النبات</div>
            <div class="input-group"><label>كمية الإضافة</label><input type="text" id="addAmount"></div>
            <div class="input-group"><label>كفاءة نظام التصريف</label><input type="text" id="sysEfficiency"></div>
            <div class="input-group"><label>كفاءة التصريف</label><input type="text" id="drainEfficiency"></div>
            <div class="input-group"><label>الحرارة والرطوبة</label><input type="text" id="tempHumid"></div>
            <div class="input-group"><label>طول النبات</label><input type="text" id="plantLength"></div>
            <div class="input-group"><label>عدد الفروع</label><input type="text" id="branchCount"></div>
            <div class="input-group"><label>الأزهار</label><input type="text" id="flowerCount"></div>
        </div>
        <button onclick="saveRecord()" id="saveBtn">حفظ البيانات</button>
        <button onclick="clearForm()" style="background-color: #757575;">إفراغ الحقول</button>
    </div>

    <div>
        <button class="btn-export no-print" onclick="exportPDF()">📄 تصدير التقرير كملف PDF</button>
        <div class="table-responsive" id="printArea">
            <table id="dataTable">
                <colgroup>
                    <col style="width: 105px;">
                    <col style="width: 55px;">
                    <col style="width: 55px;">
                    <col style="width: 55px;">
                    <col style="width: 55px;">
                    <col style="width: 55px;">
                    <col style="width: 55px;">
                    <col style="width: 90px;">
                    <col style="width: 80px;">
                    <col style="width: 80px;">
                    <col style="width: 80px;">
                    <col style="width: 70px;">
                    <col style="width: 70px;">
                    <col style="width: 70px;">
                    <col style="width: 100px;">
                </colgroup>
                <thead>
                    <tr>
                        <th class="fake-rowspan-top">التاريخ</th>
                        <th colspan="3">قياس المحلول قبل الإضافة</th>
                        <th colspan="3">قياس بعد الإضافة</th>
                        <th class="fake-rowspan-top">كمية الإضافة</th>
                        <th class="fake-rowspan-top">نظام التصريف</th>
                        <th class="fake-rowspan-top">كفاءة التصريف</th>
                        <th class="fake-rowspan-top">الحرارة والرطوبة</th>
                        <th class="fake-rowspan-top">طول النبات</th>
                        <th class="fake-rowspan-top">عدد الفروع</th>
                        <th class="fake-rowspan-top">الأزهار</th>
                        <th class="fake-rowspan-top no-print">الإجراءات</th>
                    </tr>
                    <tr>
                        <th class="fake-rowspan-bottom"></th>
                        <th>T.D.C</th><th>PH</th><th>EC</th>
                        <th>T.D.C</th><th>PH</th><th>EC</th>
                        <th class="fake-rowspan-bottom"></th>
                        <th class="fake-rowspan-bottom"></th>
                        <th class="fake-rowspan-bottom"></th>
                        <th class="fake-rowspan-bottom"></th>
                        <th class="fake-rowspan-bottom"></th>
                        <th class="fake-rowspan-bottom"></th>
                        <th class="fake-rowspan-bottom"></th>
                        <th class="fake-rowspan-bottom no-print"></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('agriRecords')) || [];

    document.getElementById('siteName').value = localStorage.getItem('siteName') || '';
    document.getElementById('cropType').value = localStorage.getItem('cropType') || '';
    document.getElementById('workerName').value = localStorage.getItem('workerName') || '';
    document.getElementById('plantDate').value = localStorage.getItem('plantDate') || '';

    const headerInputs = ['siteName', 'cropType', 'workerName', 'plantDate'];
    headerInputs.forEach(id => {
        document.getElementById(id).addEventListener('input', function() {
            localStorage.setItem(id, this.value);
        });
    });

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        records.forEach((rec, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="white-space: nowrap;">${rec.entryDate || '-'}</td>
                <td>${rec.beforeTDC || '-'}</td>
                <td>${rec.beforePH || '-'}</td>
                <td>${rec.beforeEC || '-'}</td>
                <td>${rec.afterTDC || '-'}</td>
                <td>${rec.afterPH || '-'}</td>
                <td>${rec.afterEC || '-'}</td>
                <td>${rec.addAmount || '-'}</td>
                <td>${rec.sysEfficiency || '-'}</td>
                <td>${rec.drainEfficiency || '-'}</td>
                <td>${rec.tempHumid || '-'}</td>
                <td>${rec.plantLength || '-'}</td>
                <td>${rec.branchCount || '-'}</td>
                <td>${rec.flowerCount || '-'}</td>
                <td class="no-print">
                    <button class="btn-edit" onclick="editRecord(${index})">تعديل</button>
                    <button class="btn-delete" onclick="deleteRecord(${index})">حذف</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function saveRecord() {
        const entryDate = document.getElementById('entryDate').value;
        if(!entryDate) { alert("الرجاء إدخال التاريخ!"); return; }

        const record = {
            entryDate: document.getElementById('entryDate').value,
            beforeEC: document.getElementById('beforeEC').value,
            beforePH: document.getElementById('beforePH').value,
            beforeTDC: document.getElementById('beforeTDC').value,
            afterEC: document.getElementById('afterEC').value,
            afterPH: document.getElementById('afterPH').value,
            afterTDC: document.getElementById('afterTDC').value,
            addAmount: document.getElementById('addAmount').value,
            sysEfficiency: document.getElementById('sysEfficiency').value,
            drainEfficiency: document.getElementById('drainEfficiency').value,
            tempHumid: document.getElementById('tempHumid').value,
            plantLength: document.getElementById('plantLength').value,
            branchCount: document.getElementById('branchCount').value,
            flowerCount: document.getElementById('flowerCount').value
        };

        const editIndex = parseInt(document.getElementById('editIndex').value);
        if (editIndex === -1) records.push(record);
        else {
            records[editIndex] = record;
            document.getElementById('editIndex').value = "-1";
            document.getElementById('saveBtn').innerText = "حفظ البيانات";
        }

        localStorage.setItem('agriRecords', JSON.stringify(records));
        renderTable();
        clearForm();
    }

    function clearForm() {
        ['entryDate','beforeEC','beforePH','beforeTDC','afterEC','afterPH','afterTDC','addAmount','sysEfficiency','drainEfficiency','tempHumid','plantLength','branchCount','flowerCount'].forEach(id => {
            document.getElementById(id).value = '';
        });
        document.getElementById('editIndex').value = "-1";
        document.getElementById('saveBtn').innerText = "حفظ البيانات";
    }

    function deleteRecord(index) {
        if(confirm("هل أنت متأكد؟")) {
            records.splice(index, 1);
            localStorage.setItem('agriRecords', JSON.stringify(records));
            renderTable();
        }
    }

    function editRecord(index) {
        const rec = records[index];
        document.getElementById('entryDate').value = rec.entryDate || '';
        document.getElementById('beforeEC').value = rec.beforeEC || '';
        document.getElementById('beforePH').value = rec.beforePH || '';
        document.getElementById('beforeTDC').value = rec.beforeTDC || '';
        document.getElementById('afterEC').value = rec.afterEC || '';
        document.getElementById('afterPH').value = rec.afterPH || '';
        document.getElementById('afterTDC').value = rec.afterTDC || '';
        document.getElementById('addAmount').value = rec.addAmount || '';
        document.getElementById('sysEfficiency').value = rec.sysEfficiency || '';
        document.getElementById('drainEfficiency').value = rec.drainEfficiency || '';
        document.getElementById('tempHumid').value = rec.tempHumid || '';
        document.getElementById('plantLength').value = rec.plantLength || '';
        document.getElementById('branchCount').value = rec.branchCount || '';
        document.getElementById('flowerCount').value = rec.flowerCount || '';

        document.getElementById('editIndex').value = index;
        document.getElementById('saveBtn').innerText = "تحديث البيانات";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function exportPDF() {
        const element = document.getElementById('mainContainer');
        const noPrintElements = document.querySelectorAll('.no-print');
        noPrintElements.forEach(el => el.style.display = 'none');
        element.classList.add('printing');

        const opt = {
            margin: 5,
            filename: 'تقرير_المحميات_المطور.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            noPrintElements.forEach(el => el.style.display = '');
            element.classList.remove('printing');
        });
    }

    window.onload = renderTable;
</script>

</body>
</html>
